[package]
name = "pumpkin-home"
description = "PumpkinHome: homes for Pumpkin - a homes screen with pagination, rename, delete confirmation and countdown teleports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# A Wasm component, which is what Pumpkin loads.
crate-type = ["cdylib"]

[dependencies]
# The library, never `pumpkin-pie-plugin`. Every Pumpkin plugin exports a symbol
# called `init-plugin`, so linking two crates that export one is a
# duplicate-symbol error.
pumpkin-plugin-api = "0.2.0"
serde.workspace = true
serde_norway.workspace = true
serde_json.workspace = true
tracing.workspace = true
