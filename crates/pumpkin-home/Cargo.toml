[package]
name = "pumpkin-home"
description = "PumpkinHome: homes for Pumpkin - a homes screen with pagination, rename, delete confirmation and countdown teleports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# A Wasm component, which is what Pumpkin loads.
crate-type = ["cdylib"]

[dependencies]
# The library, never `pumpkin-pie-plugin`. Every Pumpkin plugin exports a symbol
# called `init-plugin`, so linking two crates that export one is a
# duplicate-symbol error.
pumpkin-plugin-api = "0.2.0"
serde.workspace = true
serde_norway.workspace = true
serde_json.workspace = true
tracing.workspace = true
# The SQLite backend. `bundled` compiles SQLite itself, so the plugin does not
# need a SQLite installation; `wasm32-wasi-vfs` is the file system shim SQLite
# uses under WASI. Both are only compiled for a wasm target, so a native build
# is unaffected by the second one.
#
# Building this for wasm needs a C compiler for the target: see the README.
rusqlite = { version = "0.42", default-features = false, features = [
    "bundled",
    "wasm32-wasi-vfs",
], optional = true }

[features]
# The SQLite backend. Without it the plugin keeps the JSON backend only, and a
# `database.yml` that asks for SQLite is reported rather than silently ignored.
default = []
sqlite = ["dep:rusqlite"]
