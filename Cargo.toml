[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# The plugin reports this through `CARGO_PKG_VERSION`, so it has to track the
# release tag. Keep the two in step when cutting a release.
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
authors = ["Rennex"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# A maintained fork of the archived `serde_yaml`, same API, and it compiles for
# `wasm32-wasip2` where a dependency on libc would not.
serde_norway = "0.9"
serde_json = "1"
tracing = "0.1"

# The plugin SDK is the v0.2 one, which is the one that can be built for WASIp3.
# It is not published yet, so `crates/pumpkin-home/Cargo.toml` pins it to the exact
# upstream commit that carries it. A component only loads on a server whose WIT
# matches the one it was built against, and the host type-checks a plugin's exports
# when it loads it, so a plugin built from the wrong commit is rejected before
# `init-plugin` runs.
# A plugin is a component, not a native library, so the size of the artifact is
# the thing worth trading build speed for.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
